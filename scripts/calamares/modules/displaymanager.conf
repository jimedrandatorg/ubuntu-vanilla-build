# Display manager depends on the desktop variant built into this ISO:
# GNOME ships gdm3; XFCE, LXDE, MATE, Cinnamon, and Budgie ship lightdm
# (with slick-greeter); LXQt and KDE Plasma ship sddm. Calamares configures
# the first one it finds installed in the target.
---
displaymanagers:
  - gdm3
  - lightdm
  - sddm

basicSetup: false
sysconfigSetup: false
